name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch: # This allows you to trigger the build manually from GitHub's UI

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install

      - name: Build Tauri App (Windows)
        working-directory: frontend
        run: npm run tauri build

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Seal-Desktop-Windows-Installer
          # Tauri drops the compiled Windows installer in the NSIS folder
          path: frontend/src-tauri/target/release/bundle/nsis/*.exe